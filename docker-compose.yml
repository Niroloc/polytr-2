# polytr — docker compose deployment
#
# Default (bot only, paper mode):
#   cp .env.example .env  &&  edit thresholds  &&  docker compose up -d
#
# With replay UI on :8080:
#   docker compose --profile replay up -d
#
# Replay a specific time range (overrides default REPLAY_FROM/REPLAY_TO):
#   REPLAY_FROM=2026-05-22T00:00:00Z REPLAY_TO=2026-05-23T00:00:00Z \
#     docker compose --profile replay up replay

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: polytr:latest
    container_name: polytr-bot
    restart: unless-stopped
    stop_grace_period: 10s
    command:
      - bot
      - --data=/data
      - --paper=${PAPER:-true}
      - --strike-step=${STRIKE_STEP:-100}
      - --strike-minutes=${STRIKE_MINUTES:-5}
      - --entry-edge=${ENTRY_EDGE:-0.03}
      - --exit-edge=${EXIT_EDGE:-0.005}
      - --min-seconds=${MIN_SECONDS:-5}
      - --tick=${TICK_SIZE:-0.01}
      - --size=${ORDER_SIZE:-100}
      - --log-file=/logs/bot.log
    volumes:
      - polytr-data:/data
      - ${HOST_LOGS_DIR:-./logs}:/logs
    environment:
      TZ: UTC
    logging:
      # Stdout/stderr still go to docker's json-file (rotated); the bot also
      # writes the same lines to /logs/bot.log which is bind-mounted from the
      # host for direct access without docker-cli wrapping.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # The bot has no HTTP surface; we just confirm the process is alive and
      # that ticks are landing on disk within the last 2 minutes.
      test: ["CMD-SHELL", "find /data -name '*.bin' -mmin -2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # Tune memory/cpu for your host:
    # deploy:
    #   resources:
    #     limits: { cpus: '2.0', memory: 512M }

  replay:
    image: polytr:latest
    container_name: polytr-replay
    restart: unless-stopped
    profiles: ["replay"]
    depends_on:
      - bot
    command:
      - replay
      - --data=/data
      - --listen=:8080
      - --from=${REPLAY_FROM:-}
      - --to=${REPLAY_TO:-}
      - --stride=${REPLAY_STRIDE:-50}
      - --strike-step=${STRIKE_STEP:-100}
      - --strike-minutes=${STRIKE_MINUTES:-5}
      - --entry-edge=${ENTRY_EDGE:-0.03}
      - --exit-edge=${EXIT_EDGE:-0.005}
      - --log-file=/logs/replay.log
    volumes:
      - polytr-data:/data
      - ${HOST_LOGS_DIR:-./logs}:/logs
    environment:
      TZ: UTC
    ports:
      - "${REPLAY_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  polytr-data:
    name: polytr-data
